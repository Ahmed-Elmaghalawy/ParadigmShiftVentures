<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta id="metaDescription" name="description" content="" />
  <title>Paradigm Shift Ventures</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: {
              500: '#c96b32',
              400: '#db8753'
            }
          },
          boxShadow: {
            glass: '0 10px 40px rgba(0,0,0,0.12)'
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>

<body class="bg-white text-neutral-900 dark:bg-neutral-950 dark:text-white transition-colors duration-700 overflow-x-hidden">
  <div class="site-aura fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div class="absolute top-[-150px] left-[-100px] w-[500px] h-[500px] bg-orange-400/20 dark:bg-orange-500/10 blur-3xl rounded-full"></div>
    <div class="absolute bottom-[-150px] right-[-100px] w-[450px] h-[450px] bg-neutral-300/40 dark:bg-white/5 blur-3xl rounded-full"></div>
  </div>

  <header class="fixed top-0 left-0 w-full z-50">
    <div class="max-w-7xl mx-auto px-6 py-5">
      <div class="glass bg-white/70 dark:bg-white/5 border border-black/5 dark:border-white/10 rounded-3xl shadow-glass px-5 md:px-6 py-4 flex items-center justify-between transition-all duration-500">
        <a href="#home" class="flex items-center gap-4 min-w-0" aria-label="Paradigm Shift Ventures home">
          <img id="brandLogo" src="./logo1.png" alt="" class="h-11 w-11 rounded-2xl object-contain bg-white/80 dark:bg-black/30 p-1" />
          <span id="brandName" class="text-xs md:text-sm tracking-[0.22em] md:tracking-[0.35em] uppercase font-semibold truncate"></span>
        </a>

        <nav id="siteNav" class="hidden md:flex items-center gap-8 text-sm text-neutral-600 dark:text-neutral-300" aria-label="Main navigation"></nav>

        <button id="themeToggle" class="theme-toggle glass bg-white/60 dark:bg-white/10 border border-black/5 dark:border-white/10 rounded-2xl h-11 w-11 grid place-items-center hover:scale-105 transition-all duration-300" type="button" aria-label="Toggle color theme">
          <span class="theme-icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="home">
    <section class="min-h-screen flex items-center pt-32 px-6">
      <div class="max-w-7xl mx-auto w-full grid lg:grid-cols-[1.05fr_0.95fr] gap-16 lg:gap-20 items-center">
        <div class="fade-up">
          <div id="heroEyebrow" class="uppercase tracking-[0.35em] text-xs text-orange-500 mb-6 font-medium"></div>
          <h1 id="heroTitle" class="text-5xl md:text-7xl font-semibold leading-[0.95] tracking-tight max-w-4xl"></h1>
          <p id="heroText" class="mt-8 text-lg leading-8 text-neutral-600 dark:text-neutral-300 max-w-2xl"></p>
          <div id="heroActions" class="mt-10 flex flex-wrap gap-4"></div>
        </div>

        <div class="fade-up">
          <div class="glass bg-white/60 dark:bg-white/5 border border-black/5 dark:border-white/10 rounded-[40px] p-7 md:p-8 shadow-glass relative overflow-hidden">
            <div class="absolute top-[-100px] right-[-80px] w-72 h-72 bg-orange-400/20 blur-3xl rounded-full" aria-hidden="true"></div>
            <div class="relative z-10">
              <div class="flex items-start justify-between gap-5 pb-5 border-b border-black/5 dark:border-white/10">
                <div>
                  <div id="identityEyebrow" class="text-sm uppercase tracking-[0.25em] text-orange-500"></div>
                  <div id="identityTitle" class="mt-2 text-2xl font-semibold"></div>
                </div>
                <img id="identityLogo" src="./logo2.png" alt="" class="hidden sm:block h-16 w-16 rounded-3xl object-contain bg-white/70 dark:bg-black/20 p-2" />
              </div>
              <div id="identityCards" class="grid gap-4 mt-5"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="about" class="px-6 py-28">
      <div class="max-w-6xl mx-auto fade-up">
        <div class="glass bg-white/60 dark:bg-white/5 border border-black/5 dark:border-white/10 rounded-[40px] p-10 md:p-14 shadow-glass">
          <div id="aboutEyebrow" class="uppercase tracking-[0.35em] text-xs text-orange-500 mb-5"></div>
          <h2 id="aboutTitle" class="text-4xl md:text-5xl font-semibold leading-tight max-w-4xl"></h2>
          <p id="aboutText" class="mt-8 text-lg leading-8 text-neutral-600 dark:text-neutral-300 max-w-4xl whitespace-pre-line"></p>
        </div>
      </div>
    </section>

    <section id="subsidiaries" class="px-6 py-10">
      <div class="max-w-7xl mx-auto">
        <div class="fade-up mb-14">
          <div id="subsidiariesEyebrow" class="uppercase tracking-[0.35em] text-xs text-orange-500 mb-4"></div>
          <h2 id="subsidiariesTitle" class="text-4xl md:text-6xl font-semibold tracking-tight"></h2>
        </div>
        <div id="subsidiaryGrid" class="grid md:grid-cols-2 xl:grid-cols-4 gap-6"></div>
      </div>
    </section>

    <section id="vision" class="px-6 py-28">
      <div class="max-w-6xl mx-auto fade-up">
        <div class="glass bg-white/60 dark:bg-white/5 border border-black/5 dark:border-white/10 rounded-[40px] p-10 md:p-16 shadow-glass text-center">
          <div id="visionEyebrow" class="uppercase tracking-[0.35em] text-xs text-orange-500 mb-5"></div>
          <h2 id="visionTitle" class="text-4xl md:text-6xl font-semibold leading-tight max-w-5xl mx-auto"></h2>
          <p id="visionText" class="mt-8 text-lg leading-8 text-neutral-600 dark:text-neutral-300 max-w-4xl mx-auto"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="px-6 pb-10 pt-4">
    <div class="max-w-7xl mx-auto">
      <div class="glass bg-white/60 dark:bg-white/5 border border-black/5 dark:border-white/10 rounded-3xl p-6 flex flex-col md:flex-row justify-between gap-4 text-sm text-neutral-600 dark:text-neutral-400">
        <div>
          <span id="footerBrand" class="font-semibold text-neutral-900 dark:text-white"></span>
          <br>
          <span id="footerLabel"></span>
        </div>
        <div id="footerText"></div>
      </div>
    </div>
  </footer>

  <script src="./assets/js/app.js" defer></script>
</body>
</html>
